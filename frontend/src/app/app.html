<!-- titolo -->
<h1>MAGAZZINO GOMME</h1>

<!-- ricerca -->
<div class="barra">
  <button (click)="filtri.showModal()">FILTRI DI RICERCA</button>
  <button>ORDINA PER</button>
</div>

<dialog #filtri>
  <app-filtri-ricerca (annulla)="filtri.close()" />
</dialog>

<!-- tabella -->
<app-tabella [gomme]="gomme()" />

<div class="barra barra-destra">
  <button>MODIFICA</button>
  <button (click)="onDelete.showModal()">CANCELLA</button>
</div>

<dialog #onDelete>
  <!-- Cancellare {{ targa }}? -->
  <button>OK</button>
  <button (click)="onDelete.close()">ANNULLA</button>
</dialog>

<router-outlet />
